services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rivo
      POSTGRES_USER: rivo
      POSTGRES_PASSWORD: rivo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivo -d rivo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
